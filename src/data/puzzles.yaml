    "puzzleId": 1030,
    "title": "Subset Sum Multiple of 200",
    "difficulty": "easy",
    "category": "discrete",
    "source": "Graviton Quant OA",
    "question": "You have 200 whole numbers. Prove that some non-empty subset of them sums to a multiple of 200.",
    "hint": "Build the sequence of prefix sums and look at each one modulo 200. How many possible remainders are there, and how many prefix sums do you have?",
    "answer": "Such a subset always exists, and in fact a contiguous one can always be found.",
    "solution": "### Construction\n\nLabel the 200 numbers $a_1, a_2, \\ldots, a_{200}$ in any fixed order. Build the prefix sums:\n\n$$S_0 = 0, \\quad S_1 = a_1, \\quad S_2 = a_1 + a_2, \\quad \\ldots, \\quad S_{200} = a_1 + a_2 + \\cdots + a_{200}$$\n\nThat's 201 values ($S_0$ through $S_{200}$).\n\n### Pigeonhole\n\nLook at each $S_i$ modulo 200 -- there are only 200 possible residues ($0, 1, \\ldots, 199$).\n\nWith 201 values and only 200 residue classes, two of the prefix sums must share the same residue mod 200. Say $S_j \\equiv S_k \\pmod{200}$ with $j < k$.\n\n### Conclusion\n\nThen:\n\n$$S_k - S_j = a_{j+1} + a_{j+2} + \\cdots + a_k$$\n\nis divisible by 200 -- and it's a genuine non-empty, contiguous block of the original numbers (since $j < k$).\n\nSo a subset summing to a multiple of 200 always exists -- in fact, a contiguous one, which is a stronger conclusion than the problem even asked for.\n\n### A note on the numbers' size\n\nThis proof never used any upper bound on the individual numbers $a_i$ (such as \"each is at most 200\") -- it holds for any 200 whole numbers, regardless of how large they are. This is a common feature of pigeonhole proofs: a bound given in a problem statement often turns out to be unnecessary, or weaker than what's actually needed for the argument to go through.\n\n### Reflex to keep\n\n\"Does some subset sum to a multiple of $n$?\" -> build prefix sums, then pigeonhole on residues mod $n$. This is one of the most reusable tricks in combinatorics: with $n$ numbers, you get $n+1$ prefix sums (including the empty one, $S_0 = 0$) but only $n$ possible residues mod $n$, guaranteeing a collision -- and any collision between two prefix sums immediately hands you a contiguous subsequence summing to a multiple of $n$.",
  },
