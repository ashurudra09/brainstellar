    "title": "Unwatched Soldier",
    "difficulty": "medium",
    "category": "discrete",
    "source": "Graviton Quant OA",
    "question": "11 soldiers stand at points in the plane, with all pairwise distances between them distinct (no two of the $\\binom{11}{2}$ distances are equal). Each soldier watches their nearest neighbor. Prove that at least one soldier is not watched by anyone.",
    "hint": "Assume, for contradiction, that every soldier is watched by someone. What does that force the \"watches\" relation to look like globally? Then think about the single closest pair of soldiers in the whole group -- what must be true about who they each watch?",
    "answer": "Such a soldier must exist; assuming otherwise leads to a contradiction via a parity argument.",
    "solution": "### Setting up the contradiction\n\nThink of \"watches\" as an arrow: soldier $A \\to B$ means $A$'s nearest neighbor is $B$. Since all pairwise distances are distinct, every soldier has a uniquely-defined nearest neighbor, so every soldier has exactly one outgoing arrow -- 11 arrows in total among 11 soldiers.\n\nAssume, for contradiction, that every soldier is watched by someone -- i.e., every soldier has at least one incoming arrow. Since there are exactly 11 arrows total and 11 soldiers, if each has at least one incoming arrow, then each must have exactly one incoming arrow (11 arrows split among 11 soldiers, each getting $\\ge 1$, forces exactly 1 each).\n\nSo under this assumption, the \"watches\" relation is a permutation of the 11 soldiers: everyone has exactly one outgoing arrow and exactly one incoming arrow, meaning the whole structure decomposes into disjoint cycles.\n\n### The globally closest pair forms a 2-cycle\n\nLet $X, Y$ be the pair of soldiers at the globally minimum distance among all pairs. Since nothing in the entire group is closer to $X$ than $Y$ is, $X$'s nearest neighbor must be $Y$. By the same reasoning, $Y$'s nearest neighbor must be $X$. So $X \\to Y$ and $Y \\to X$: a mutual pair, a 2-cycle.\n\n### The pair is \"sealed off\" from the rest\n\nUnder the assumption, $X$ has exactly one incoming arrow -- and we've just shown it comes from $Y$. So no other soldier's nearest neighbor can be $X$ (that would give $X$ a second incoming arrow, contradicting the exactly-one-each structure). The same holds for $Y$. So $\\{X, Y\\}$ is entirely self-contained: nothing outside the pair points into it, and the pair points only at each other.\n\nThis means the remaining 9 soldiers' nearest-neighbor arrows all stay within those 9 soldiers, and the same assumption (everyone watched) still holds among just those 9, since none of their incoming arrows could have come from $X$ or $Y$.\n\n### Recursing down to a contradiction\n\nRemove $X$ and $Y$. Repeat the exact same argument on the remaining 9 soldiers: find their own globally closest pair, show it's a self-contained 2-cycle, remove it, leaving 7. Continue: $11 \\to 9 \\to 7 \\to 5 \\to 3 \\to 1$.\n\nSince 11 is odd, this process eventually leaves exactly one soldier standing alone. But a single soldier can't form a mutual 2-cycle -- there's no one left for their nearest-neighbor arrow to pair up with. This contradicts the entire chain of reasoning, which followed necessarily from the assumption that everyone is watched.\n\nTherefore the assumption is false: at least one soldier is not watched by anyone.\n\n### Reflex to keep\n\nAssume the opposite, and count/pair up. When a \"watches\" / \"points-to\" / \"nearest\" relation is forced into a bijection by a false assumption, decompose it into cycles. A globally extremal pair (closest, farthest, largest, smallest) is almost always the natural place to peel off a guaranteed 2-cycle, since an extremal object has no competition for \"who's closest to me\" -- removing it and recursing is what turns a single observation into a full parity argument. The same \"peel off a forced 2-cycle\" idea generalizes: this argument shows the \"watches\" relation, if a total bijection, must decompose entirely into 2-cycles, which is only possible when the total number of participants is even.",
  },
