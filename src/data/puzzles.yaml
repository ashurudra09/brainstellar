    "title": "Rolling the Same Values Twice",
    "difficulty": "medium",
    "category": "probability",
    "source": "Custom",
    "question": "Two fair 6-sided dice are rolled and their upfaces are recorded. If both dice are rolled again, what is the probability that the values rolled on the second trial are the same as on the first trial (i.e. the same two numbers show up, regardless of which die shows which)?",
    "hint": "Split into two cases: the first roll was a double (both dice show the same number), or the first roll was two different numbers. A non-double pair can be matched in more ways on the second roll than a double can.",
    "answer": "$\\dfrac{11}{216}$",
    "solution": "Treat the outcome of a roll as the unordered pair of values shown, since the question only cares about \"the values rolled,\" not which specific die showed which number.\n\n**Case 1: the first roll is a double $(a,a)$.**\nThere are 6 such doubles, each occurring with probability $\\dfrac{1}{36}$ (only one of the 36 ordered outcomes gives that double). To match it, the second roll must also come up $(a,a)$, which again happens with probability $\\dfrac{1}{36}$.\n\n**Case 2: the first roll is a non-double pair $\\{a,b\\}$, $a \\neq b$.**\nThere are 15 such unordered pairs, each occurring with probability $\\dfrac{2}{36}$ (two ordered outcomes, $(a,b)$ and $(b,a)$, give the same pair). To match it, the second roll must show the same pair $\\{a,b\\}$, again with probability $\\dfrac{2}{36}$.\n\n**Combine via total probability:**\n\n$$P = \\underbrace{6 \\cdot \\frac{1}{36}\\cdot\\frac{1}{36}}_{\\text{doubles}} + \\underbrace{15 \\cdot \\frac{2}{36}\\cdot\\frac{2}{36}}_{\\text{non-doubles}} = \\frac{6}{1296} + \\frac{60}{1296} = \\frac{66}{1296} = \\frac{11}{216}$$\n\n### Common mistake\nIt's tempting to say each die independently has a $\\frac16$ chance of repeating its own value, giving $\\left(\\frac16\\right)^2 = \\frac{1}{36}$. This undercounts: a non-double pair like $\\{3,5\\}$ can be \"matched\" either by die 1 rolling a 3 and die 2 rolling a 5, *or* by die 1 rolling a 5 and die 2 rolling a 3 \u2014 two ways, not one \u2014 which is why non-doubles contribute more per-pair probability than doubles do.",
