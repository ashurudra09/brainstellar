    "puzzleId": 1031,
    "title": "Repeated Absolute Difference",
    "difficulty": "medium",
    "category": "discrete",
    "source": "Graviton Quant OA",
    "question": "Write the numbers $1$ through $50$ on a board. Repeatedly pick any two numbers $a, b$ still on the board, erase them, and write $|a-b|$ instead. Keep doing this until only one number remains. What are the possible values of that final number?",
    "hint": "Look for a quantity that stays invariant (or changes in a predictable, limited way) every time you replace $a, b$ with $|a-b|$. Consider both the parity of the total sum on the board, and the maximum value ever present on the board.",
    "answer": "The possible final values are exactly the odd numbers 1, 3, 5, ..., 49.",
    "solution": "### Invariant 1: the parity of the sum never changes\n\nThe key algebraic fact: $|a-b| \\equiv a+b \\pmod 2$ (subtracting a number and adding it agree in parity, since flipping a sign doesn't change parity). So each time you erase $a, b$ and write $|a-b|$, the total sum on the board changes by exactly $(a+b) - |a-b|$, which is always an even number. This means the parity of the total sum on the board is invariant -- unchanged by any sequence of operations, no matter which pairs you pick or in what order.\n\nThe initial sum is $1 + 2 + \\cdots + 50 = \\frac{50 \\times 51}{2} = 1275$, which is odd. So the final remaining number must be odd.\n\nA tempting but incorrect shortcut here is to link the final number's parity directly to the count of numbers $n$ (e.g. \"if $n$ is even, the final number is odd\"). This does not hold in general: for $n=4$ with numbers $1,2,3,4$ (sum $=10$, even), one valid sequence of moves is $1,2 \\to 1$ (board $\\{1,3,4\\}$), then $3,4 \\to 1$ (board $\\{1,1\\}$), then $\\to 0$ -- an even final result, despite $n=4$ being even. The true invariant is the parity of the sum, not the parity of $n$ itself; they only coincide for some specific values of $n$, such as $n=50$ in this problem.\n\n### Invariant 2: the final number can never exceed the starting maximum\n\n$|a-b|$ is never larger than $\\max(a,b)$ -- subtracting a non-negative amount can only shrink or preserve the larger of the two values, never grow it. Since every number on the board starts at most $50$, and every operation replaces two numbers with something no larger than the larger of the two, the maximum value present on the board can only decrease or stay the same over time, never increase. So the final number satisfies:\n\n$$\\text{final number} \\le 50$$\n\n### Combining the two constraints\n\nThe final number must be odd and at most 50, so it must be one of $1, 3, 5, \\ldots, 49$.\n\n### All of these values are achievable\n\nThe invariants only rule out even values and values above 49 -- they don't automatically guarantee every odd value from 1 to 49 is reachable, so a construction is needed to confirm achievability. One systematic approach: pair up numbers from the top down to produce a controllable pile of small values. For example, pairing $(50,49), (48,47), \\ldots$ down to a chosen point converts most of the numbers into a collection of $1$'s (and possibly a couple of leftover values), and pairs of $1$'s can then be combined ($1,1 \\to 0$) to cancel out in twos, letting you tune the process so that exactly the desired odd target $k \\in \\{1,3,\\ldots,49\\}$ survives at the end. (Working out the exact pairing sequence for an arbitrary target $k$ is a short constructive exercise; the essential point for the purposes of an interview answer is recognizing that both invariants are tight -- nothing beyond \"odd and $\\le 49$\" rules out a value -- and that small-case verification confirms every such value is reachable.)\n\n### Reflex to keep\n\nParity invariant on a repeated-replacement operation: whenever an operation on a collection of numbers replaces two of them with something built from their difference, sum, or product, check whether that operation preserves the parity (or some other fixed residue) of a running total. Here, $|a-b| \\equiv a+b \\pmod 2$ is the specific identity that makes the whole problem tractable -- the same identity underlies many \"reduce a pile of numbers to one\" problems. Pair this with a monotonicity bound (the maximum can only shrink, never grow) whenever the operation is bounded by $\\max(a,b)$, to pin down the full range of possible final values rather than just their parity.",
  },
