    "puzzleId": 1033,
    "title": "Broken Stick n-gon",
    "difficulty": "hard",
    "category": "probability",
    "source": "Custom",
    "question": "A stick of length 1 is broken at $n-1$ points chosen independently and uniformly at random along its length, producing $n$ pieces. What is the probability that these $n$ pieces can be arranged to form a convex $n$-gon (a polygon with $n$ sides)?\n\n(The classic special case is $n=3$: break a stick at 2 random points into 3 pieces \u2014 what's the probability they form a triangle?)",
    "hint": "A polygon can be formed from $n$ given side lengths summing to a fixed total if and only if no single side is at least half the total length \u2014 this is the direct generalization of the triangle inequality. Figure out the probability that the largest piece is $\\geq 1/2$, and use the fact that at most one piece can ever be that large.",
    "answer": "$$P_n = 1 - \\dfrac{n}{2^{n-1}}$$\n\nFor the classic triangle case ($n=3$): $P_3 = \\dfrac{1}{4}$.",
    "solution": "### The polygon inequality\n$n$ lengths that sum to a fixed total $L$ can be arranged into a convex $n$-gon if and only if **no single piece is $\\geq L/2$**. This is exactly the generalization of the familiar triangle inequality (a side must be shorter than the sum of all the other sides combined).\n\nSo we need the probability that, after breaking the unit stick at $n-1$ random points, every one of the $n$ resulting pieces is strictly less than $1/2$.\n\n### Distribution of a single piece\nLet $D_1, \\dots, D_n$ be the $n$ spacings produced by $n-1$ independent uniform points on $[0,1]$. These spacings follow a symmetric Dirichlet distribution, and a standard order-statistics fact gives the marginal tail probability of any one spacing:\n$$P(D_i \\geq t) = (1-t)^{n-1}, \\qquad 0 \\le t \\le 1.$$\n\n(Quick way to see this: $P(D_1 \\geq t)$ is the probability all $n-1$ break points land in the remaining interval of length $1-t$, which \u2014 after rescaling \u2014 happens with probability $(1-t)^{n-1}$.)\n\n### At most one piece can be too big\nSince all $n$ pieces sum to exactly $1$, it's impossible for two different pieces to each be $\\geq 1/2$ (that would already force the total to exceed 1, except on a probability-zero boundary case). So the \\\"bad\\\" events $\\{D_i \\geq 1/2\\}$ for $i=1,\\dots,n$ are (almost surely) mutually exclusive.\n\nBy symmetry among the $n$ pieces, this lets us just add up the individual probabilities:\n$$P(\\text{some piece} \\geq \\tfrac12) = \\sum_{i=1}^n P(D_i \\geq \\tfrac12) = n \\cdot \\left(\\frac{1}{2}\\right)^{n-1}.$$\n\n### Final answer\n$$P_n = 1 - n\\left(\\frac12\\right)^{n-1} = 1 - \\frac{n}{2^{n-1}}.$$\n\n### Checking against the classic triangle case\nFor $n = 3$:\n$$P_3 = 1 - \\frac{3}{2^2} = 1 - \\frac34 = \\frac14.$$\n\nThis matches the well-known \\\"broken stick\\\" triangle probability.\n\n### Sanity table\n\n| $n$ | Shape | $P_n$ |\n|---|---|---|\n| 3 | Triangle | $1-\\frac34=\\frac14$ |\n| 4 | Quadrilateral | $1-\\frac48=\\frac12$ |\n| 5 | Pentagon | $1-\\frac{5}{16}=\\frac{11}{16}$ |\n| 6 | Hexagon | $1-\\frac{6}{32}=\\frac{13}{16}$ |\n| $n\\to\\infty$ | \u2014 | $\\to 1$ |\n\nAs $n$ grows, it becomes exponentially unlikely for any one piece to dominate half the stick, so the probability of a valid polygon quickly climbs toward 1.",
  },
]
