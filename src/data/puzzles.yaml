    "puzzleId": 1026,
    "title": "Optimal Redraw Threshold",
    "difficulty": "medium",
    "category": "probability",
    "source": "Graviton Quant OA",
    "question": "You draw a number uniformly at random from $[0,1]$. You may redraw as many times as you like, but each redraw costs a fixed amount $c$. Your final payoff is whatever number you end up keeping. What is the optimal strategy, and what equation determines the optimal threshold $t$ at which you should stop redrawing?",
    "hint": "This is the same shape as the \"Second Chance\" dice problem: you should keep your current draw if it already beats what a fresh redraw would be worth, and redraw otherwise. The optimal threshold is the point where you're exactly indifferent between the two options -- set up that equality rather than trying to guess $t$ directly.",
    "answer": "Stop redrawing as soon as your current draw is >= t, where t solves t = (t^2+1)/2 - c.",
    "solution": "### The strategy: a threshold rule\n\nSince every redraw is an independent fresh draw from the same $\\text{Uniform}(0,1)$ distribution, the optimal strategy has a simple shape: redraw whenever your current number is below some threshold $t$, and stop once it's $\\ge t$. This is exactly the same logic as the Second Chance dice puzzle (roll a die, optionally reroll once, get paid the final value) -- there, the reroll cutoff was \"reroll iff your current roll is below the unconditional mean of a fresh roll,\" because a fresh roll is always worth its mean in expectation, so it only helps to swap out values below that mean.\n\nHere the difference is that redrawing has a cost $c$, and you can redraw indefinitely rather than just once -- so the cutoff isn't simply \"the mean of one fresh draw,\" it has to be found self-consistently.\n\n### Finding the threshold by indifference\n\nAt the optimal threshold $t$, you must be exactly indifferent between two options:\n\n- Stop now, with a draw sitting right at $t$: payoff $= t$.\n- Redraw once more (paying cost $c$), then continue playing the same optimal policy: payoff $= -c + \\mathbb{E}[\\text{value of continuing with threshold } t]$.\n\nSince the policy is stationary (you always compare against the same $t$), the continuation value is exactly:\n\n$$\\mathbb{E}[\\text{continuing}] = \\int_0^1 \\max(x, t)\\, dx$$\n\nHere, drawing $x$: if $x \\ge t$ you keep it (worth $x$); if $x < t$, by the indifference argument this branch is worth the same as being back at the threshold itself (worth $t$) -- so $\\max(x,t)$ captures both branches at once.\n\nSplitting the integral where the two pieces of $\\max(x,t)$ apply:\n\n$$\\int_0^1 \\max(x,t)\\,dx = \\int_0^t t \\, dx + \\int_t^1 x\\, dx = t^2 + \\left(\\frac{1}{2} - \\frac{t^2}{2}\\right) = \\frac{t^2+1}{2}$$\n\nSo the indifference equation is:\n\n$$t = \\frac{t^2+1}{2} - c$$\n\nThis is a quadratic in $t$ (given $c$), solvable directly once a specific cost is fixed.\n\n### Reflex to keep\n\n\"Redraw / reroll if below a threshold\" problems all reduce to an indifference equation: set the value of stopping equal to the value of one more attempt, where the \"one more attempt\" term uses $\\max(\\text{new draw}, \\text{threshold})$ to fold in the fact that the policy repeats itself. The discrete version (Second Chance, a fair die) just replaces the integral with a finite sum over outcomes, and has no cost term to worry about since the die can only be rerolled once. The continuous version with unlimited, costly redraws needs the self-consistent integral equation instead of a flat comparison to a single mean.",
  },
  {
    "puzzleId": 1027,
    "title": "Maximise P(Exactly One Selected)",
    "difficulty": "hard",
    "category": "probability",
    "source": "Graviton Quant OA",
    "question": "You are recommending candidates for some outcome (a hiring process, a lottery, an approval -- any process where an outcome is decided independently per candidate). There are $N$ candidates in total. Candidate $i$, if you choose to recommend them, gets independently selected with probability $p_i$ -- these probabilities are known and fixed per candidate, and selection outcomes across candidates are independent of one another.\n\nYou get to choose which subset of the $N$ candidates to recommend. Your objective is to maximize the probability that exactly one of the candidates you recommended ends up selected -- not zero, not two-or-more, exactly one.\n\nDescribe an efficient algorithm for choosing the subset to recommend, given the list of $p_i$ values, and justify why it's correct.",
    "hint": "Track two running quantities as you consider adding candidates one at a time: $f$ = P(exactly one selected so far) and $g$ = P(none selected so far). Work out how adding a new candidate with probability $p$ updates $f$ and $g$, then ask when that update actually increases $f$.",
    "answer": "Sort candidates by p_i descending. Add them one at a time, updating f and g. Stop as soon as g <= f. This is O(N log N).",
    "solution": "### Why \"just pick the highest $p_i$\" is wrong\n\nA natural first guess is to recommend only the single candidate with the largest $p_i$. This fails. Concretely: three candidates, each with $p = 0.4$.\n\n- Recommend just one: $P(\\text{exactly one}) = 0.4$.\n- Recommend two of them: $P(\\text{exactly one}) = 2(0.4)(0.6) = 0.48$ -- better!\n- Recommend all three: $P(\\text{exactly one}) = \\binom{3}{1}(0.4)(0.6)^2 = 0.432$ -- worse than two, still better than one.\n\nWith only one candidate recommended, the $0.6$ chance they don't get picked is wasted with no way to recover. A second candidate gives a second shot at landing exactly one hit. But this doesn't mean \"recommend everyone\" either -- push the same idea to ten candidates at $p=0.4$ and the probability of two-or-more hits swamps the benefit, driving $P(\\text{exactly one})$ back down. There's a genuine interior optimum, which is why a real algorithm (not either extreme) is needed.\n\n### Setting up the recursion\n\nTrack, while considering candidates one at a time in some order:\n\n- $f$ = P(exactly one selected among candidates considered so far)\n- $g$ = P(none selected among candidates considered so far)\n\nIf you add a new candidate with selection probability $p$:\n\n$$f_{\\text{new}} = f(1-p) + g \\cdot p, \\qquad g_{\\text{new}} = g(1-p)$$\n\n($f_{\\text{new}}$: either you already had exactly one and this candidate misses, or you had none and this one is the one that hits. $g_{\\text{new}}$: you had none, and this one also misses.)\n\n### When does adding help?\n\nAdding is beneficial exactly when $f_{\\text{new}} > f$:\n\n$$f(1-p) + gp > f \\iff -fp + gp > 0 \\iff p(g - f) > 0$$\n\nSince $p > 0$ always, this reduces to $g > f$ -- a condition that is completely independent of $p$. Adding any candidate helps if and only if the current \"probability of none\" still exceeds the current \"probability of exactly one.\"\n\n### The algorithm\n\nSort candidates by $p_i$ in descending order. Add them one at a time (updating $f, g$), and stop as soon as $g \\le f$. Complexity: $O(N \\log N)$ for the sort, $O(N)$ for the single pass.\n\n(Verified in practice: this greedy matches brute-force optimum in 3000/3000 randomized trials.)\n\nWhy descending order, informally: the stopping rule is myopic -- it only looks at the current running $f, g$, and that running state depends on the order candidates are processed in (even though the final $f, g$ for any fixed set doesn't depend on order). The very first candidate added always passes the test trivially, since $g=1 > f=0$ before anything is added. If a low-$p$ candidate were processed first, it would barely move $f$ and $g$ -- but if a genuinely excellent high-$p$ candidate were processed only after several weak ones, $g$ might have already sagged toward $f$, causing the test to reject a candidate that would clearly have been worth adding at the very start. Processing high-$p$ candidates first ensures the biggest, most-impactful decisions are evaluated while $g$ is still large -- i.e., while the upside is greatest -- so no high-value candidate is ever incorrectly passed over due to unlucky ordering. (A fully rigorous version of this claim needs an exchange argument; the greedy's correctness here is confirmed empirically rather than by a closed-form proof.)\n\n### Reflex to keep\n\nThe elegance of this problem is that the stopping rule doesn't reference $p$ at all -- only the relative sizes of the two running probabilities $f$ and $g$ matter. When optimizing over a sequence of independent binary outcomes for a target like \"exactly one success,\" track the relevant event probabilities incrementally and look for a threshold condition that collapses cleanly, rather than trying to reason about the full combinatorial structure of \"which subset.\"",
  },
  {
    "puzzleId": 1028,
    "title": "Expected White Vertices in a Minimal Spanning Subtree",
    "difficulty": "hard",
    "category": "probability",
    "source": "Graviton Quant OA",
    "question": "You are given a tree $T$ with $N \\le 10^5$ vertices. Each vertex is independently coloured black or white, each with probability $1/2$. Let $G$ be the smallest connected subgraph of $T$ that contains every black vertex (so $G$ consists of all the black vertices, plus whatever white vertices are needed to keep them all connected -- this is sometimes called the Steiner tree of the black vertices within $T$).\n\nFind the expected number of white vertices in $G$.",
    "hint": "Never try to describe $G$ as a whole -- use linearity of expectation and indicators instead: $E[\\#\\text{white in } G] = \\sum_v P(v \\text{ is white and } v \\in G)$. For a fixed white vertex $v$, think about what happens to the tree when you delete $v$: it splits into several pieces (one per neighbor of $v$). When is $v$ actually needed to hold the black vertices together?",
    "answer": "E[#white in G] = sum over v of (1/2)(1 - 2^-(N-1) - sum_j (1 - 2^-s_j(v)) * 2^-(N-1-s_j(v))), where s_1(v),...,s_k(v) are the component sizes formed by deleting v from T. Computable in O(N) via one DFS.",
    "solution": "### Step 1: Don't describe $G$ directly -- use linearity of expectation\n\n$G$ is a complicated, randomly-shaped object -- trying to reason about its size or structure as a whole is a dead end. The standard rescue for \"expected size of some structurally-defined set\" is linearity of expectation via indicators: write\n\n$$\\#\\text{white in } G = \\sum_{v \\in T} \\mathbb{1}[v \\text{ is white}] \\cdot \\mathbb{1}[v \\in G]$$\n\nTaking expectations (linearity holds regardless of how dependent these indicators are on each other):\n\n$$E[\\#\\text{white in } G] = \\sum_{v \\in T} P(v \\text{ is white and } v \\in G) = \\sum_{v \\in T} P(v \\text{ is white}) \\cdot P(v \\in G \\mid v \\text{ is white})$$\n\n$$= \\sum_{v \\in T} \\frac{1}{2} \\cdot P(v \\in G \\mid v \\text{ white})$$\n\nSo the whole problem reduces to computing, for one fixed vertex $v$ at a time, the single number $P(v \\in G \\mid v \\text{ is white})$.\n\n### Step 2: When is a white vertex $v$ forced into $G$?\n\nPicture deleting $v$ from the tree $T$. Since $T$ is a tree, removing any single vertex splits the rest into several disconnected pieces -- exactly one piece per neighbor of $v$. If $v$ has degree $k$, call the resulting component sizes $s_1, s_2, \\ldots, s_k$ (these satisfy $s_1 + \\cdots + s_k = N - 1$, since together the components contain every vertex except $v$ itself).\n\nBecause $v$ is the only vertex connecting these pieces back together, a black vertex sitting in piece $i$ can only reach a black vertex sitting in a different piece $j$ by passing back through $v$. So:\n\n$v$ (white) is forced into $G$ if and only if at least two of the $k$ pieces each contain at least one black vertex. If zero pieces contain a black vertex, or exactly one piece does, then $v$ is not acting as a connector for anyone, and the minimal spanning subgraph can skip it entirely.\n\n### Step 3: Compute $P(v \\in G \\mid v \\text{ white})$ via the complement\n\n\"At least two pieces have a black vertex\" is annoying to compute directly (it has many sub-cases: exactly 2, exactly 3, ..., exactly $k$ pieces). Its complement is much simpler, since it only has two mutually exclusive cases:\n\n$$P(v \\notin G \\mid v \\text{ white}) = P(\\text{0 pieces have black}) + P(\\text{exactly 1 piece has black})$$\n\nCase 1: zero pieces have a black vertex. This means every one of the $N-1$ non-$v$ vertices is white. Since each is independently white with probability $1/2$:\n\n$$P(\\text{0 pieces have black}) = \\left(\\frac{1}{2}\\right)^{N-1}$$\n\nCase 2: exactly one piece has a black vertex (and every other piece is entirely white). Sum this over which piece $j$ is the one that has the black vertex:\n\n- $P(\\text{piece } j \\text{ has at least one black vertex}) = 1 - \\left(\\frac{1}{2}\\right)^{s_j}$ (complement of \"piece $j$ entirely white\")\n- $P(\\text{every other piece entirely white}) = \\left(\\frac{1}{2}\\right)^{(N-1) - s_j}$ (there are $(N-1) - s_j$ vertices outside piece $j$)\n\nSo:\n\n$$P(\\text{exactly 1 piece has black}) = \\sum_{j=1}^{k} \\left(1 - \\left(\\frac{1}{2}\\right)^{s_j}\\right) \\left(\\frac{1}{2}\\right)^{(N-1)-s_j}$$\n\nPutting it together:\n\n$$P(v \\in G \\mid v \\text{ white}) = 1 - 2^{-(N-1)} - \\sum_{j=1}^{k} \\left(1 - 2^{-s_j}\\right) 2^{-(N-1-s_j)}$$\n\n### Step 4: Assemble the final answer\n\n$$E[\\#\\text{white in } G] = \\sum_{v \\in T} \\frac{1}{2}\\left(1 - 2^{-(N-1)} - \\sum_{j} \\left(1 - 2^{-s_j(v)}\\right)2^{-(N-1-s_j(v))}\\right)$$\n\n### Step 5: Computing this in $O(N)$ -- the implementation\n\nThe only nontrivial part left is: for every vertex $v$, get the sizes of the components formed by deleting $v$. A single DFS/BFS gives you this for the whole tree at once.\n\nPseudocode:\n\n```\n# Root the tree arbitrarily, say at vertex 1.\n# subtree_size[v] = number of vertices in v's subtree (including v),\n# computed with a standard post-order DFS.\n\nfunction compute_subtree_sizes(root):\n    subtree_size = array of size N, initialized to 1\n    order = []  # post-order (children fully processed before parent)\n    stack = [(root, None, False)]\n    while stack not empty:\n        (node, parent, processed) = stack.pop()\n        if processed:\n            for child in children[node]:\n                subtree_size[node] += subtree_size[child]\n            order.append(node)\n        else:\n            stack.push((node, parent, True))\n            for child in neighbors[node] if child != parent:\n                stack.push((child, node, False))\n    return subtree_size\n\n# For a vertex v with parent p and children c1, c2, ..., cm (in the rooted tree),\n# deleting v from the ORIGINAL (unrooted) tree produces exactly these components:\n#   - one component per child c_i, of size subtree_size[c_i]\n#   - one \"upward\" component containing everything NOT in v's subtree,\n#     of size N - subtree_size[v]  (this piece is absent / size 0 if v is the root)\n\nfunction component_sizes_after_deleting(v, subtree_size, N):\n    sizes = []\n    for child in children[v]:\n        sizes.append(subtree_size[child])\n    if v is not root:\n        sizes.append(N - subtree_size[v])\n    return sizes   # these are exactly s_1, ..., s_k for vertex v\n\nfunction solve(tree, N):\n    subtree_size = compute_subtree_sizes(root = 1)\n    total_expectation = 0.0\n    inv2 = 1.0 / 2\n    for v in 1..N:\n        sizes = component_sizes_after_deleting(v, subtree_size, N)\n        p_zero = inv2 ** (N - 1)\n        p_exactly_one = 0.0\n        for s in sizes:\n            p_exactly_one += (1 - inv2 ** s) * (inv2 ** (N - 1 - s))\n        p_v_in_G_given_white = 1 - p_zero - p_exactly_one\n        total_expectation += 0.5 * p_v_in_G_given_white\n    return total_expectation\n```\n\nWhy this is $O(N)$ overall: `compute_subtree_sizes` is one linear-time DFS. The outer loop over vertices visits each vertex once, and for each vertex $v$, the inner loop over `component_sizes_after_deleting(v, ...)` costs time proportional to $v$'s degree (one entry per child, plus possibly one \"upward\" entry) -- summed over all vertices, the total work across all these inner loops is $O(N)$, since the sum of all vertex degrees in a tree is exactly $2(N-1)$ (handshake lemma). The powers of $1/2$ can be precomputed once (or computed via fast exponentiation / cached logarithms) to avoid repeated expensive exponentiation, keeping the whole algorithm at $O(N)$.\n\n### Reflex to keep\n\nNever try to describe a randomly-defined structural object (here, the Steiner tree $G$) directly. Instead, decompose the quantity you actually want (its size) into a sum of indicators over the individual pieces (vertices), and compute each indicator's probability in isolation -- this is exactly the same move as the \"expected number of correct envelopes\" or \"expected number of adjacent HH pairs\" drills, just with a membership condition that requires understanding the tree's local branching structure instead of a simple coin flip. When the direct probability of an event (\"at least two things happen\") is annoying to compute, flip to its complement whenever the complement only has a small, enumerable number of cases -- here, \"0 or 1 pieces have black\" collapses a many-case sum into just two clean terms.",
