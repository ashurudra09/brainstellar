    "hint": "\"Each switch touches exactly 2 bulbs\" should make you think of graph edges. Model bulbs as vertices and switches as edges -- then the goal becomes: find a subset of edges (a 2-colouring: chosen vs. not chosen) so that every chamber has vertices of both colours among its bulbs. Eulerian circuits give you a clean way to 2-colour edges.",
    "answer": "Such a subset of switches always exists -- constructed via a dummy vertex plus an Eulerian-circuit edge 2-colouring.",
    "solution": "### Setting up the graph\n\nSince every switch toggles exactly two bulbs, model each bulb as a vertex and each switch as an edge connecting the two bulbs it controls (a multigraph -- parallel edges and edges within the same chamber are both allowed). Flipping a chosen set of switches corresponds to choosing a subset of edges; a bulb ends up on exactly when it is touched by an odd number of chosen edges.\n\nEquivalently: 2-colour every switch (edge) red or blue, where \"red\" means \"flip this switch.\" A bulb's final state is on iff it's touched by an odd number of red edges. The goal -- every chamber has both an on bulb and an off bulb -- becomes: find a red/blue edge-colouring such that every chamber contains vertices with different final states.\n\n### The construction\n\n1. Fix parity. Some chambers' bulbs may have odd total degree in this switch-graph. By the handshake lemma, the number of odd-degree vertices is even, so add a dummy vertex and connect it to every odd-degree vertex with one new edge. Now every vertex (including the dummy) has even degree.\n\n2. Eulerian circuit. A connected graph where every vertex has even degree has an Eulerian circuit (a closed walk using every edge exactly once). Take such a circuit in each connected component and colour its edges alternately red and blue as you traverse it.\n\n3. Why this balances every chamber. Because the colouring alternates strictly along the circuit, every time the circuit passes through a vertex, it uses one incoming edge and one outgoing edge of different colours. So every vertex accumulates roughly equal numbers of red and blue edges among its incident edges.\n\n4. Remove the dummy. Delete the dummy vertex and its incident edges. Each real bulb loses at most one edge. This is where \"$\\ge 3$ bulbs per chamber\" earns its keep: after step 1, every vertex has degree $\\ge 4$, which guarantees at least 2 edges of each colour before deletion. Removing one edge can't wipe out a colour entirely.\n\n5. Conclude. Turn on exactly the bulbs touched by an odd number of red edges. Since every chamber's bulbs collectively see both colours, every chamber ends up with a genuine mix -- never all on, never all off.\n\n### Reflex to keep\n\nWhenever a problem states \"each switch/domino/rule touches exactly 2 things,\" model those 2 things as an edge in a graph. When the goal is \"every group has a mix of two outcomes,\" reach for an edge 2-colouring, and Eulerian circuits are a standard tool for producing one for free by alternating colour along the tour.",
  },
  {
    "puzzleId": 1024,
    "title": "Birth-Death Stationary Distribution",
    "difficulty": "medium",
    "category": "probability",
    "source": "Graviton Quant OA",
    "question": "A random process moves on the states $\\{0, 1, 2, \\ldots\\}$. From any state $i \\ge 1$, it moves up to $i+1$ with probability $0.2$, down to $i-1$ with probability $0.3$, and stays at $i$ with probability $0.5$. From state $0$ specifically, it moves up to $1$ with probability $0.2$ and stays at $0$ with probability $0.8$.\n\nWhat fraction of time does this process spend at state $0$ in the long run?",
    "hint": "This is a birth-death chain (every move is $\\pm 1$ or \"stay\"). For chains like this, you don't need the full transition matrix -- use detailed balance: in the long run, the rate of crossing from $i$ to $i+1$ must equal the rate of crossing back from $i+1$ to $i$. The \"stay\" probabilities never appear in this equation.",
    "answer": "1/3",
    "solution": "### Why a steady state exists at all\n\nBefore computing anything, it's worth checking that a stable long-run distribution exists in the first place, since the state space here is infinite. A Markov chain converges to a unique long-run distribution when it is:\n\n1. Irreducible -- every state can reach every other state. Here, the chain can move up or down freely, so yes.\n2. Aperiodic -- it isn't locked into a rigid cycle. The nonzero \"stay\" probabilities guarantee this immediately.\n3. Positive recurrent -- the chain doesn't drift off to infinity forever; it returns to low states often enough.\n\nPoint 3 is the one that actually needs checking on an infinite state space, and it hinges on the numbers given: away from state $0$, the process moves down with probability $0.3$ and up with probability $0.2$. Since $0.3 > 0.2$, there's a net downward drift whenever the chain is away from the boundary -- like a random walk biased back toward $0$. This is what prevents the chain from wandering off to infinity and guarantees a genuine, non-degenerate stationary distribution exists. (If instead the up-probability were $\\ge$ the down-probability, the chain would drift outward forever and the long-run fraction of time at any fixed state would be $0$ -- no valid stationary distribution.)\n\n### Detailed balance\n\nBecause this is a birth-death chain (moves are strictly $\\pm 1$ or a self-loop), draw an imaginary boundary between state $i$ and state $i+1$. In the long run, every time the process crosses that boundary going up, it must eventually cross back going down -- otherwise probability mass would keep accumulating on one side forever, contradicting the fact that the long-run fractions $\\pi_i$ have settled to fixed values. So the rate of up-crossings must equal the rate of down-crossings:\n\n$$\\pi_i \\cdot P(\\text{up from } i) = \\pi_{i+1} \\cdot P(\\text{down from } i+1)$$\n\nSelf-loops (the \"stay\" probabilities $0.5$ and $0.8$) never cross the boundary, so they simply don't appear in this equation -- they're red herrings for this particular question.\n\n### Solving\n\nWith $P(\\text{up}) = 0.2$ and $P(\\text{down}) = 0.3$ for every relevant state:\n\n$$\\pi_i \\cdot 0.2 = \\pi_{i+1} \\cdot 0.3 \\implies \\pi_{i+1} = \\frac{2}{3}\\pi_i$$\n\nSo $\\pi_i = \\pi_0 \\left(\\frac{2}{3}\\right)^i$, a geometric sequence. Normalizing:\n\n$$\\sum_{i=0}^{\\infty} \\pi_i = \\pi_0 \\sum_{i=0}^{\\infty} \\left(\\frac{2}{3}\\right)^i = \\pi_0 \\cdot \\frac{1}{1 - 2/3} = 3\\pi_0 = 1$$\n\n$$\\implies \\pi_0 = \\frac{1}{3}$$\n\n(Simulated confirmation: long-run fraction at state 0 comes out to approximately 0.330.)\n\n### Takeaway\n\nFor a birth-death chain, skip building the full transition matrix -- detailed balance across each boundary gives you the ratio between consecutive $\\pi_i$ directly, and self-loop (\"stay\") probabilities are irrelevant to that ratio. Always sanity-check first that the up/down probabilities create a net inward drift; without it, no stationary distribution exists to solve for.",
  },
  {
    "puzzleId": 1025,
    "title": "Card Flipping",
    "difficulty": "hard",
    "category": "discrete",
    "source": "Graviton Quant OA",
    "question": "There are $P$ cards, each either face up or face down. Let $k$ be the number of cards currently face-up. Flip the $k$-th card (in some fixed order), and repeat.\n\n1. Prove that, starting from any configuration, this process always terminates (reaches all cards face-down, at which point $k=0$ and there is no card to flip).\n2. Find the expected number of steps to termination, starting from a uniformly random configuration of $P$ cards.",
    "hint": "For part 1: the process is deterministic on a finite state space, so it either halts or cycles -- rule out cycles by strong induction on $P$, splitting on whether the last card starts up or down.\n\nFor part 2: split on the last card again. If it starts down, you get the $(P-1)$-card problem for free. If it starts up, try complementing every bit and reversing the card order on the rest -- see what rule that turns the dynamics into.",
    "answer": "1. Yes, it always terminates.\n2. E_P = P(P+1)/4.",
    "solution": "### Part 1: Termination, by strong induction on $P$\n\nBase case ($P=1$): from face-down, the process is already terminal (0 steps). From face-up, $k=1$, flip the one card, done in 1 step. Either way it terminates.\n\nInductive step. Assume every configuration of $P-1$ cards terminates in finitely many steps. Consider a configuration $x = (x_1, \\ldots, x_P)$ of $P$ cards.\n\nCase $x_P = 0$ (last card down). The total up-count is $k = (\\text{up-count of the first } P-1 \\text{ cards})$, since the last card contributes $0$. This never exceeds $P-1$, so card $P$ is never selected -- every flip targets one of the first $P-1$ cards, and the rule applied to them is exactly the standard $(P-1)$-card process running on the prefix, with card $P$ frozen at $0$. By the induction hypothesis, this prefix process terminates in finitely many steps, so the whole configuration does too.\n\nCase $x_P = 1$ (last card up). Let $u$ denote the up-count of the first $P-1$ cards at any point while $x_P$ remains $1$; the total up-count is $u+1$. As long as $u < P-1$, we have $k = u+1 \\le P-1$, so the flip always lands on a prefix card -- specifically, card number $u+1$ (one more than the prefix's own up-count). Call this the shifted rule.\n\nClaim: the shifted rule on the prefix is exactly the standard rule on a transformed copy of the prefix. Define $y_i = 1 - x_i$ (complement every bit) and $z_i = y_{P-i}$ for $i = 1, \\ldots, P-1$ (reverse the order). If the prefix $x$ has up-count $u$, then $y$ has up-count $(P-1) - u$, and since reversing doesn't change a count, $z$ has up-count $v = (P-1) - u$ as well. Flipping $x_{u+1}$ is the same physical bit as flipping $y_{u+1}$, which (by the reversal $z_i = y_{P-i}$, i.e. $y_{u+1} = z_{P-1-u} = z_v$) is the same bit as flipping $z_v$ -- and $v$ is exactly $z$'s own up-count. So flipping $x_{u+1}$ under the shifted rule corresponds, step for step, to flipping $z_v$ under the standard rule.\n\nThe handoff point $u = P-1$ (prefix all up) corresponds to $v = 0$ (i.e. $z$ all down) -- exactly the standard game's terminal condition. So the shifted process on $x$'s prefix terminates (reaches \"all up\") in finitely many steps if and only if the standard $(P-1)$-card process on $z$ terminates -- which it does, by the induction hypothesis.\n\nOnce the prefix reaches all-up while $x_P = 1$, the total up-count becomes $P$, so card $P$ flips (down), landing us in the $x_P = 0$ case with an all-up prefix -- which terminates in finitely many further steps by the case above.\n\nEither way, the $P$-card process terminates.\n\n### Part 2: Expected number of steps, $E_P$\n\nLet $E_P$ denote the expected number of steps to termination from a uniformly random configuration of $P$ cards ($E_0 = 0$).\n\nSplit on the last card, each case occurring with probability $1/2$:\n\nIf $x_P = 0$: by the Part 1 argument, the dynamics exactly mirror the standard $(P-1)$-card process on a uniformly random prefix. Expected steps in this branch: $E_{P-1}$.\n\nIf $x_P = 1$: by the bijection above, the number of steps for the prefix to reach \"all up\" under the shifted rule equals the number of steps for the standard $(P-1)$-process on $z$ (the complemented, reversed prefix) to terminate. Since the original prefix is uniform, so is $z$, so this takes $E_{P-1}$ steps in expectation. Then 1 more step flips card $P$ down. The prefix is now all up, and card $P$ is down -- the case above shows this then runs as a standard $(P-1)$-process starting specifically from all cards up.\n\nLet $M_n$ be the (deterministic) number of steps for the standard $n$-card process starting from all cards up. From all-up, $k=n$, so the top card flips down, leaving \"$n-1$ cards up, one down\" -- which by the $x_P=0$ argument runs as the standard $(n-1)$-process on an all-up prefix. So $M_n = 1 + M_{n-1}$, with $M_1 = 1$. Hence $M_n = n$.\n\nSo, in the $x_P=1$ branch: expected steps $= E_{P-1} + 1 + M_{P-1} = E_{P-1} + 1 + (P-1) = E_{P-1} + P$.\n\nCombining both branches:\n\n$$E_P = \\frac{1}{2}E_{P-1} + \\frac{1}{2}\\left(E_{P-1} + P\\right) = E_{P-1} + \\frac{P}{2}$$\n\nSolving this recurrence with $E_0 = 0$:\n\n$$E_P = \\sum_{i=1}^{P} \\frac{i}{2} = \\frac{1}{2}\\cdot\\frac{P(P+1)}{2} = \\frac{P(P+1)}{4}$$\n\nChecking against small cases: $E_1 = 1/2$, $E_2 = 3/2$, $E_3 = 3$, $E_4 = 5$, $E_5 = 15/2$ -- all match direct enumeration.\n\n### Reflexes to keep\n\n- Termination on a finite, deterministic state space: it must halt or cycle -- ruling out cycles via induction on a natural sub-structure (here, the last card) is the standard move.\n- A \"shifted\" version of a familiar rule is often the familiar rule in disguise. Here, complementing every bit and reversing the order turned the shifted rule back into the standard rule on a bijectively-transformed (and still uniformly random) state -- which is what makes the expectation solvable in closed form rather than needing brute-force enumeration.",
  },
